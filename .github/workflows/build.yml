name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: tracer-nametags
          path: build/libs/*.jar

      - name: Inspect mapped Minecraft (temporary)
        run: |
          J=""
          for c in $(find ~/.gradle .gradle -iname '*.jar' 2>/dev/null | grep -iE "yarn|merged|mapped|minecraft"); do
            if javap -p -cp "$c" net.minecraft.client.gui.screen.ingame.HandledScreen >/dev/null 2>&1; then J="$c"; break; fi
          done
          echo "JAR=$J"
          echo "--- HandledScreen"
          javap -p -cp "$J" net.minecraft.client.gui.screen.ingame.HandledScreen | grep -iE "focusedSlot|backgroundWidth|backgroundHeight| x;| y;|getSlotAt|drawMouseoverTooltip|drawSlot|getTooltip" || true
          echo "--- ContainerComponent"
          javap -p -cp "$J" net.minecraft.component.type.ContainerComponent | head -40 || true
          echo "--- Slot"
          javap -p -cp "$J" net.minecraft.screen.slot.Slot | grep -iE "public|getStack|getIndex" | head -20 || true
          echo "--- DrawContext"
          javap -p -cp "$J" net.minecraft.client.gui.DrawContext | grep -iE "drawItem|drawStackOverlay|drawTooltip|fillGradient|void fill\\(" | head -20 || true
          echo "--- DataComponentTypes CONTAINER"
          javap -p -cp "$J" net.minecraft.component.DataComponentTypes | grep -iE "CONTAINER" || true
